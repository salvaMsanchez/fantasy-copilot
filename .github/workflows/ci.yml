name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comprobaciones:
    name: Linter y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el paquete
        run: python -m pip install -e ".[dev]"
      - name: Linter
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Tests
        run: pytest
